name: PAL3 反编译管线
description: |
  PAL3.exe MSVC6 匹配反编译。AI 自动工作流 + 人工有限干预。
  Phase 1: 通过编译 → Phase 2: 质量提升（match + 命名 + 可维护性）
version: "3.1"

params:
  - name: project_root
    type: path
    description: PAL3Decomp 项目根目录
    required: true
  - name: ida_path
    type: text
    description: IDA Pro idat64 可执行文件路径
    required: true

primary: engineer

agents:
  engineer:
    soul: |
      你是 PAL3 反编译工程师，运行在自动工作流模式。
      目标：产生与 PAL3.exe 原始二进制字节匹配的 C/C++ 源码。
      流程约束和工作方法由 pal3-gates plugin 提供。
      你应该持续自主工作，直到遇到无法解决的问题时才停下请求人工干预。

directives: |
  ## 里程碑

  ### Phase 1: 通过编译（当前阶段）
  目标：所有 src/pal3/*.cpp 编译通过（MSVC6, 0 error）
  退出标准：cmake --build build/pal3 exit 0

  ### Phase 2: 质量提升
  目标：byte-match ≥ 95% + 语义命名 + 可维护代码
  退出标准：match ≥ 95% + _todo_ 趋零 + 人工 review 通过

  ## 自主工作模式
  持续迭代，不需要等待人工确认每一步。
  Stop hook 在每轮结束时触发经验蒸馏，然后自动继续。
  只有致命错误或需要人工判断时才停下。

  ## 初始化
  首次启动检查：
  1. IDB: $param.project_root/original/PAL3.exe.i64
  2. Annotations: $param.project_root/pipeline/data/annotations/functions.json
  3. CLI: python pipeline/cli.py --help

ui:
  data:
    # 进度指标（Number + progress_bar hint）
    compile_rate: { type: number, initial: 0, persist: true, hint: progress_bar }
    naming_rate: { type: number, initial: 0, persist: true, hint: progress_bar }
    match_rate: { type: number, initial: 0, persist: true, hint: progress_bar }

    # 趋势数据（List + chart hint）
    naming_trend: { type: list, initial: [], persist: true, hint: chart }

    # 迭代时间线（List + timeline hint）
    iterations: { type: list, initial: [], persist: true, hint: timeline }

    # 文本面板（详情）
    milestone_status: { type: text, initial: "## Phase 1: 通过编译\n\n等待首次检查点...", persist: true }
    file_detail: { type: text, initial: "## 文件明细\n\n等待编译...", persist: true }

  layout:
    split: horizontal
    ratio: [55, 45]
    children:
      - split: vertical
        ratio: [40, 60]
        children:
          - panel:
              id: dashboard
              title: 进度概览
              kind: data
              slots: [compile_rate, naming_rate, match_rate, naming_trend]
          - panel:
              id: timeline
              title: 迭代记录
              kind: data
              slots: [iterations]
      - split: vertical
        ratio: [40, 60]
        children:
          - panel:
              id: milestone
              title: 里程碑
              kind: markdown
              bind: milestone_status
          - panel:
              id: files
              title: 文件明细
              kind: markdown
              bind: file_detail
