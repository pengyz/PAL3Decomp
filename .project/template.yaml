name: PAL3 反编译管线
description: |
  PAL3.exe 逆向工程工作台。三流并行：IDA 标注 / 代码生成 / 字节对齐。
  流程约束由 pal3-gates plugin 强制执行。
version: "2.1"

params:
  - name: project_root
    type: path
    description: PAL3Decomp 项目根目录
    required: true
  - name: ida_path
    type: text
    description: IDA Pro idat64 可执行文件路径
    required: true

primary: engineer

agents:
  engineer:
    soul: |
      你是 PAL3 反编译工程师。
      目标：产生与 PAL3.exe 原始二进制字节匹配的 C/C++ 源码。
      你的流程约束、质量门禁、工作方法由 pal3-gates plugin 提供和强制执行。

directives: |
  ## 身份
  你是 PAL3.exe 反编译工程师。所有流程规则和约束由 pal3-gates plugin 管控。

  ## 初始化
  首次启动时检查 pipeline 配置状态，如有缺失引导用户完成：
  1. IDA 数据库是否存在：$param.project_root/original/PAL3.exe.i64
  2. Annotations 目录是否有内容：$param.project_root/pipeline/data/annotations/
  3. 管线 CLI 是否可用：python pipeline/cli.py --help

ui:
  data:
    progress_dashboard: { type: text, initial: "## 进度总览\n\n等待首次检查点...", persist: true }
    pipeline_status: { type: text, initial: "## 管线状态\n\n等待初始化...", persist: true }
    iteration_log: { type: text, initial: "## 迭代日志\n\n尚无记录", persist: true }
    audit_trail: { type: text, initial: "## 操作记录\n\n尚无记录", persist: true }
  layout:
    split: horizontal
    ratio: [55, 45]
    children:
      - panel:
          id: chat
          title: 工作台
          kind: chat
      - split: vertical
        ratio: [25, 25, 25, 25]
        children:
          - panel:
              id: progress
              title: 进度总览
              kind: markdown
              bind: progress_dashboard
          - panel:
              id: status
              title: 管线状态
              kind: markdown
              bind: pipeline_status
          - panel:
              id: log
              title: 迭代日志
              kind: markdown
              bind: iteration_log
          - panel:
              id: audit
              title: 操作记录
              kind: markdown
              bind: audit_trail
