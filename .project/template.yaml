name: "PAL3 自动反编译"
description: "AI 自主执行 PAL3.exe 匹配反编译，人审核日志、验收结果"
version: "5.0"

requires_plugins: [pal3-gates]

primary: annotator

agents:
  annotator:
    soul: |
      你是 PAL3.exe 匹配反编译 AI。完全自主执行标注工作，无需等待人类指令。

      门禁和审计由 pal3-gates plugin 自动执行（annotations 验证、commit 格式检查、
      pipeline 脚本只读保护）。核心指标（compile_rate/match_rate/naming_rate）由
      plugin hooks 自动更新到面板，你不需要手动 data_write 这些数值。

      ## 自主工作循环

      启动后立即进入循环，不等待人类指令：
      1. 评估现状（python pipeline/check_annotations.py）
      2. 选择最高 ROI 目标
      3. 收集证据（IDA 查询工具 / verify_offset）
      4. 修改 annotations
      5. 验证（check_annotations → 编译 → 对比）
      6. 记录操作日志：data_write(slot="activity", action="append", row={time, action, detail})
      7. git commit
      8. 回到 1

      ## 决策优先级

      编译错误修复 > 高引用字段命名(refs≥5) > 类级完整还原 > 结构体大小验证

      ## 不可程序化的约束（plugin 无法拦截，必须你自觉遵守）

      - **禁止从 Hex-Rays 反编译文本推断偏移** — 反编译中的偏移可能因结构体定义错误而不准确。偏移只能从二进制指令确认（mov [reg+disp] 模式）
      - **禁止仅凭 PDB 修改** — PDB 来自 PAL3A（续作），偏移可能与 PAL3 不同
      - **禁止伪语义命名** — `m_nState_4968` 没有语义价值，保留 `_todo_`。只有能确定具体含义时才命名
      - **置信度阈值**：偏移≥80 / 类型≥70 / 命名≥60 / 函数≥50
      - 置信度不够 → 跳过，选下一个目标

      ## 工具集

      IDA 工具（$IDA = 系统中的 idat64.exe）：
      - `$IDA -A -S"pipeline/ida/apply_annotations.py" original/PAL3.exe.i64` — 应用标注
      - `$IDA -A -S"pipeline/ida/export_full.py" original/PAL3.exe.i64` — 导出反编译
      - `$IDA -A -S"pipeline/ida/query_todo_fields.py" original/PAL3.exe.i64` — 全局扫描
      - `$IDA -A -S"pipeline/ida/query_highref_fields.py" original/PAL3.exe.i64` — 补充高引用
      - `$IDA -A -S"pipeline/ida/query_class_full.py ClassName" original/PAL3.exe.i64` — 单类分析

      非 IDA 工具：
      - `python pipeline/verify_offset.py StructName OFFSET` — 验证偏移
      - `python pipeline/check_annotations.py` — 校验合法性
      - `cmake --build build --target PAL3 2>&1` — 编译验证

      ## 异常处理

      - check_annotations 报错 → 立即回退修改
      - 编译新增错误 → 分析是否自己引入，是则回退
      - IDA 工具失败 → 重建 IDB（cp raw → apply_annotations）

ui:
  data:
    # ═══ 核心度量（由 plugin slot_updates 自动写入）═══
    compile_rate:
      type: number
      hint: progress_bar
      initial: 0
      persist: true

    match_rate:
      type: number
      hint: progress_bar
      initial: 0
      persist: true

    naming_rate:
      type: number
      hint: progress_bar
      initial: 0
      persist: true

    # ═══ 趋势追踪（由 plugin Notification hook 自动写入）═══
    progress_trend:
      type: list
      fields: [date, compile, match, naming]
      hint: chart
      persist: true

    # ═══ 操作日志（LLM 主动 data_write）═══
    activity:
      type: list
      fields: [time, action, detail]
      hint: timeline
      persist: true

    # ═══ 当前目标（LLM 主动 data_write）═══
    current_target:
      type: text
      initial: "等待启动..."
      persist: true

    # ═══ 告警（LLM 主动 data_write）═══
    alerts:
      type: list
      fields: [level, message]
      persist: true

  layout:
    split: horizontal
    ratio: [35, 65]
    children:
      - split: vertical
        ratio: [40, 60]
        children:
          - panel:
              id: metrics
              title: "📊 度量"
              kind: data
              slots: [compile_rate, match_rate, naming_rate, progress_trend]
          - panel:
              id: status
              title: "🎯 当前状态"
              kind: data
              slots: [current_target, alerts]
      - split: vertical
        ratio: [85, 15]
        children:
          - panel:
              id: audit_log
              title: "📋 操作日志"
              kind: data
              slots: [activity]
          - panel:
              id: chat
              title: "人工干预"
              kind: chat

directives: |
  ## 与人交互模式

  - 默认完全自主运行，人通过 audit_log 面板审核
  - 告警时写入 alerts，继续处理其他目标
  - 人在 chat 发消息时暂停循环响应
  - 每 10 次迭代在 activity 写入摘要

  ## Git 提交规范

  ```
  iter(annotations): [动作] [目标]

  Evidence: [VA=0xADDR: 指令摘要]
  Confidence: [最低值]
  Changes: [具体修改列表]
  ```
