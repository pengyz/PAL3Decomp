[pytest]
markers =
    slow: 集成测试（需编译器/IO，默认排除）
# 默认收集只跑本项目自己的测试：
#   tools/ghidra                          Ghidra 发行包（内含 Python 2/Jython 源码与其自带测试，非本项目代码）
#   pipeline/ida/_archive                 归档的 IDA 专用脚本（依赖 ida_typeinf，不是 pytest 用例）
#   tests/tools/test_audit_callsite_evidence.py
#                                         该用例针对 c70c44883 之前的 audit_callsite/instr_width API，工具已改为
#                                         调用形三分类（audit_callsite_evidence 现只导出 classify_call_form/
#                                         summarize_callsites），用例待重写；不参与默认收集
addopts = -m "not slow" --ignore=tools/ghidra --ignore=pipeline/ida/_archive --ignore=tests/tools/test_audit_callsite_evidence.py
